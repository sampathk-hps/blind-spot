name: blindspot
description: "Track invoices, insurances, and subscriptions with automated alerts and AES-256 encryption."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ────────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Navigation ──────────────────────────────────────────────────────────────
  go_router: ^14.2.0

  # ── Local Storage ───────────────────────────────────────────────────────────
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # ── Secure Storage ──────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.0.0

  # ── Encryption ──────────────────────────────────────────────────────────────
  encrypt: ^5.0.3
  pointycastle: ^3.9.1

  # ── Firebase ────────────────────────────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.0.4

  # ── Local Notifications ─────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.2

  # ── In-App Purchases ────────────────────────────────────────────────────────
  in_app_purchase: ^3.2.0

  # ── Fonts ───────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ── Biometric Auth ──────────────────────────────────────────────────────────
  local_auth: ^2.3.0

  # ── File Picker ─────────────────────────────────────────────────────────────
  file_picker: ^8.0.7

  # ── Internationalisation ────────────────────────────────────────────────────
  intl: ^0.19.0

  # ── HTTP Client ─────────────────────────────────────────────────────────────
  dio: ^5.4.3+1

  # ── Charts ──────────────────────────────────────────────────────────────────
  fl_chart: ^0.68.0

  # ── Animations ──────────────────────────────────────────────────────────────
  flutter_animate: ^4.5.0

  # ── Permissions ─────────────────────────────────────────────────────────────
  permission_handler: ^11.3.1

  # ── UUID ────────────────────────────────────────────────────────────────────
  uuid: ^4.4.0

  # ── Connectivity ────────────────────────────────────────────────────────────
  connectivity_plus: ^6.0.3

  # ── Shared Preferences ──────────────────────────────────────────────────────
  shared_preferences: ^2.3.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
